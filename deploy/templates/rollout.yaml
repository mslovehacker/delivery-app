{{- if .Values.progressiveDelivery }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: delivery-app
  labels:
    app: delivery-app
spec:
  replicas: {{ .Values.replicaCount }}
  progressDeadlineSeconds: {{ .Values.canary.progressDeadlineSeconds }}
  progressDeadlineAbort: {{ .Values.canary.progressDeadlineAbort }}
  selector:
    matchLabels:
      app: delivery-app
  strategy:
    canary:
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
  template:
    metadata:
      labels:
        app: delivery-app
    spec:
      imagePullSecrets:
        - name: ncr-cred
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
